name: 🚀 Release

on:
  push:
    branches:
      - main

env:
  CI: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Version and publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required to mint the OIDC token used for trusted publishing
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # `changeset publish` runs `pnpm publish` in a pnpm workspace, and
          # pnpm's OIDC (trusted publishing) support needs >=12
          version: 12

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Create release PR or build and publish packages
        uses: changesets/action@v1
        with:
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
